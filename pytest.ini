[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    # textstat 0.7.4 imports the deprecated setuptools pkg_resources API.
    # Harmless for scoring; setuptools is pinned in requirements.txt.
    ignore:pkg_resources is deprecated as an API:DeprecationWarning
    ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning
